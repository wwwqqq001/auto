name: ci

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Job ID
      run_id:
        description: Run ID
      callback_url:
        description: Callback URL
  push:
    branches:
      - main
  schedule:
    - cron: "*/15 * * * *"

jobs:
  autogreen:
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v3
      - name: Auto green
        run: |
          git config --local user.name "wwwqqq001"
          git config --local user.email "112799078+wwwqqq001@users.noreply.github.com"
          git remote set-url origin https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          git pull --rebase
          ts=$(date -u +"%Y-%m-%d %H:%M UTC")
          echo "last run: $ts" > last-run.txt
          git add last-run.txt
          git commit -m "auto green: $ts"
          git push
